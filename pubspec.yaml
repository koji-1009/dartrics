name: dartrics
description: >-
  Citation-anchored Dart code-quality metrics (CK, Halstead, McCabe, Martin,
  Cognitive) plus Periphery-style unused public-API detection, shaped for
  AI refactor loops.
version: 0.7.0
repository: https://github.com/koji-1009/dartrics
issue_tracker: https://github.com/koji-1009/dartrics/issues
topics:
  - metrics
  - lint
  - analyzer
  - ai
  - quality

environment:
  sdk: ^3.10.0

executables:
  dartrics:

dependencies:
  analysis_server_plugin: ^0.3.15
  analyzer: ^13.0.0
  args: ^2.5.0
  crypto: ^3.0.0
  dapper: ^1.4.6
  glob: ^2.1.0
  io: ^1.0.0
  logging: ^1.2.0
  meta: ^1.18.0
  path: ^1.9.0
  pool: ^1.5.1
  yaml: ^3.1.0

dev_dependencies:
  analyzer_testing: ^0.2.6
  coverage: ^1.15.0
  lints: ^6.0.0
  test: ^1.25.6
  test_reflective_loader: ^0.4.0
