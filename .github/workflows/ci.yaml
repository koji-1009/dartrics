name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: dart-${{ matrix.dart }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        dart:
          - stable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ matrix.dart }}
      - run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test example
      - name: Analyze
        # Skip analyzer-plugin loading; the plugin runs in an isolate and
        # is exercised by its own AnalysisRuleTest suite.
        run: dart analyze lib test example
      - name: Test
        run: dart test
      - name: Coverage
        run: dart pub run coverage:test_with_coverage --fail-under=95
