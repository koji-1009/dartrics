name: Analyze

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart analyze

  format:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart pub run coverage:test_with_coverage
      # 100% line coverage is a stated requirement (AGENTS.md); enforce it
      # here instead of relying on the codecov app's relative default.
      - name: Enforce 100% line coverage
        run: |
          uncovered=$(grep '^DA:' coverage/lcov.info | grep -c ',0$' || true)
          if [ "$uncovered" -ne 0 ]; then
            echo "::error::$uncovered uncovered line(s) in lib/ — 100% line coverage is required."
            awk -F'[:,]' '/^SF:/ { file = $2 } /^DA:/ { if ($3 == 0) print file ":" $2 }' coverage/lcov.info
            exit 1
          fi
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  publish-dry-run:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      # A bad .pubignore once shipped broken archives (see CHANGELOG 0.2.1);
      # keep the packaging check on every push instead of only at release.
      - run: dart pub publish --dry-run

  self-application:
    name: dartrics analyze --fatal-warnings (self-application gate)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    needs: [analyze]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      # `--snapshot none` because CI runners are fresh checkouts —
      # the per-file hash cache has no value across runs.
      - run: dart run bin/dartrics.dart analyze --root . --snapshot none --fatal-warnings
